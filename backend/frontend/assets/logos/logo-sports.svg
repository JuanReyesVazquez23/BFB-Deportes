<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" aria-label="BFB Deportes - Béisbol, Fútbol y Basketball">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc400;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffd94d;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="10" y="40" fill="#0a0a0c" font-family="Anton, sans-serif" font-size="36" font-weight="bold" letter-spacing="0.02">B</text>
  <text x="50" y="40" fill="#ffc400" font-family="Anton, sans-serif" font-size="36" font-weight="bold" letter-spacing="0.02">F</text>
  <text x="95" y="40" fill="#0a0a0c" font-family="Anton, sans-serif" font-size="36" font-weight="bold" letter-spacing="0.02">B</text>
  <text x="140" y="40" fill="#ffc400" font-family="Anton, sans-serif" font-size="36" font-weight="bold" letter-spacing="0.02">DEPORTES</text>
  
  <!-- Baseball detail on first B -->
  <path d="M42 28 Q50 10 Q58 28 H42 Z" fill="#ffc400" opacity="0.3"/>
  <path d="M50 30 Q55 35 Q60 30 H50 Z" fill="#ffc400"/>
  <circle cx="55" cy="32" r="2" fill="#ffc400"/>
  <circle cx="58" cy="30" r="2" fill="#ffc400"/>
  
  <!-- Soccer detail on F -->
  <path d="M95 10 V50 M105 10 V50 M115 10 V50" stroke="#ffc400" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 25 Q105 10 Q110 25 H100 Z" fill="#ffc400" opacity="0.3"/>
  <circle cx="105" cy="30" r="3" fill="#ffc400"/>
  <circle cx="110" cy="32" r="3" fill="#ffc400"/>
  
  <!-- Basketball detail on second B -->
  <path d="M152 28 Q160 10 Q168 28 H152 Z" fill="#ffc400" opacity="0.3"/>
  <path d="M160 30 Q165 35 Q170 30 H160 Z" fill="#ffc400"/>
  <path d="M155 32 Q158 38 Q161 32 H155 Z" fill="#ffc400"/>
  <circle cx="158" cy="34" r="3" fill="#ffc400"/>
  <circle cx="161" cy="32" r="3" fill="#ffc400"/>
</svg>